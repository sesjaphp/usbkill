name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l main.go main_test.go)"

      - name: Test
        run: go test .

      - name: Race test
        run: go test -race .

      - name: Vet
        run: go vet .

      - name: Build
        run: go build -trimpath -o usbkill .

      - name: Validate package metadata and scripts
        run: |
          bash -n PKGBUILD
          grep -q '^[[:space:]]*pkgver = ' .SRCINFO
          grep -q '^pkgbase = usbkill$' .SRCINFO

      - name: Validate systemd units
        run: |
          mkdir -p .ci-units
          sed "s|/usr/bin/usbkill|$PWD/usbkill|g" usbkill.service > .ci-units/usbkill.service
          sed "s|/usr/bin/usbkill|$PWD/usbkill|g" usbkill-autoarm.service > .ci-units/usbkill-autoarm.service
          cp usbkill-failure.service .ci-units/usbkill-failure.service
          systemd-analyze verify .ci-units/usbkill.service .ci-units/usbkill-failure.service .ci-units/usbkill-autoarm.service

      - name: Check whitespace
        run: git diff --check
