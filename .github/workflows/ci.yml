name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l main.go main_test.go)"

      - name: Test
        run: go test .

      - name: Race test
        run: go test -race .

      - name: Vet
        run: go vet .

      - name: Build
        run: go build -trimpath -o usbkill .

      - name: Validate package metadata and scripts
        run: |
          bash -n PKGBUILD
          grep -q '^pkgver = ' .SRCINFO
          grep -q '^pkgname = usbkill$' .SRCINFO

      - name: Validate systemd units
        run: systemd-analyze verify usbkill.service usbkill-failure.service usbkill-autoarm.service

      - name: Check whitespace
        run: git diff --check
