name: Bug report
description: Report a reproducible behavior problem in usbkill
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include USB serial numbers, hostnames, usernames, credentials, disk identifiers, or private logs. For security vulnerabilities, use SECURITY.md instead of a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.3.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Arch Linux, systemd version, kernel version"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide steps that do not power off a real machine. Use test mode or a mock boundary.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include only redacted logs and remove device-identifying values.
      render: text
